</style><aside><div class="logo">vet<b>connect</b><small>COMMUNICATION STUDIO</small></div><div class="muted">ESPAÇO DE TRABALHO</div><button class="nav active" onclick="go('overview',this)">◫　Visão geral</button><button class="nav" onclick="go('inbox',this)">▤　Conversas</button><button class="nav" onclick="go('flow',this)">⌘　Flow Studio</button><button class="nav" onclick="go('assistant',this)">✧　Assistente</button><button class="nav" onclick="go('campaign',this)">↗　Campanhas</button><button class="nav" onclick="go('agenda',this)">▦　Agendamentos</button><button class="nav" onclick="go('contacts',this)">◎　Contatos</button><div class="foot"><b>Clínica Aurora</b><p>Ambiente demonstrativo</p>● Atendimento simulado</div></aside><main><header><div><div class="eyebrow">AURORA VETERINÁRIA / STUDIO</div><div class="muted">Comunicação que aproxima.</div></div><span class="tag">● Modo demonstração</span></header><section id="page" class="page"></section></main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const seed={people:[{name:'Mariana Costa',pet:'Luna',consent:true,msg:['Olá! Gostaria de agendar uma consulta para a Luna.']},{name:'Rafael Lima',pet:'Thor',consent:true,msg:['Boa tarde! Quando é o próximo retorno do Thor?']},{name:'Beatriz Alves',pet:'Mel',consent:false,msg:['Vocês atendem aos sábados?']}],flows:{start:'Olá! Bem-vindo à Clínica Aurora. Como podemos ajudar?',consulta:'Vamos solicitar seu agendamento. Nossa equipe confirmará o horário.',vacina:'Podemos conferir o calendário vacinal com nossa equipe.',urgencia:'Procure atendimento veterinário imediatamente. Estamos encaminhando sua mensagem à equipe humana.',outro:'Nossa equipe dará continuidade ao atendimento.'},campaigns:[],agenda:[],assistant:'Aurora Assistente'};let db;try{db=JSON.parse(localStorage.getItem('vetconnect_demo'))||seed}catch{db=seed}let current=0,screen='overview',test=[];function save(){localStorage.setItem('vetconnect_demo',JSON.stringify(db))}function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2400)}function go(s,b){screen=s;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function title(t,d){return `<h1>${t}</h1><p>${d}</p>`}function row(a,b){return `<div class="row"><span>${a}</span><span>${b}</span></div>`}function render(){let h='';if(screen==='overview')h=title('Visão geral','Uma visão integrada da comunicação da sua clínica.')+`<div class="hero"><div class="eyebrow" style="color:#9fcbff">ATENDIMENTO INTELIGENTE</div><h1>Mais cuidado. Menos espera.</h1><p>Organize conversas e construa experiências de atendimento personalizadas.</p><button onclick="go('flow',document.querySelectorAll('.nav')[2])">Abrir Flow Studio →</button></div><div class="grid">${[['Conversas simuladas',db.people.length],['Mensagens registradas',db.people.reduce((a,p)=>a+p.msg.length,0)],['Solicitações',db.agenda.length],['Campanhas',db.campaigns.length]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="num">${b}</div><span class="tag">Demo</span></div>`).join('')}</div><div class="two"><div class="card"><h2>Volume de atendimento</h2><div class="muted">Série ilustrativa · últimos 7 dias</div><div class="bars">${[45,75,56,92,70,85,60].map((x,i)=>`<div class="bar" style="height:${x}%"><span>${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'][i]}</span></div>`).join('')}</div></div><div class="card"><h2>Conversas recentes</h2>${db.people.map((p,i)=>row(esc(p.name)+'<br><small>'+esc(p.pet)+'</small>',`<button class="secondary" onclick="current=${i};go('inbox',document.querySelectorAll('.nav')[1])">Abrir</button>`)).join('')}</div></div>`;
if(screen==='inbox'){let p=db.people[current];h=title('Central de conversas','Atendimento organizado em um só lugar.')+`<div class="card inbox"><div class="contacts">${db.people.map((x,i)=>`<button class="contact ${i===current?'active':''}" onclick="current=${i};render()">${esc(x.name)}<br><small>${esc(x.pet)}</small></button>`).join('')}</div><div class="chat"><h2>${esc(p.name)} · ${esc(p.pet)}</h2><div class="muted">${esc(p.owner||'Não atribuído')} · ${esc(p.label||'Novo atendimento')}</div><div class="row"><button class="secondary" onclick="assign()">Atribuir atendimento</button><button class="secondary" onclick="labelChat()">Etiqueta</button></div><div class="messages">${p.msg.map((m,i)=>`<div class="bubble ${i?'out':''}">${esc(m)}</div>`).join('')}</div><div class="compose"><input id="message" placeholder="Escreva uma resposta simulada"><button onclick="send()">Enviar</button></div><button class="secondary" style="margin-top:9px" onclick="note()">Adicionar nota interna</button>${(p.notes||[]).map(n=>`<p>Nota interna: ${esc(n)}</p>`).join('')}</div></div>`}
if(screen==='flow')h=title('Flow Studio','Edite os blocos e teste a experiência do cliente.')+`<div class="two"><div class="card"><h2>Fluxo de atendimento</h2><div class="flow"><div class="node">↳ Mensagem recebida</div><div class="arrow"></div><button class="node" onclick="edit('start')">✧ Boas-vindas</button><div class="arrow"></div><div class="node">Escolha do cliente</div><div class="arrow"></div><div class="branches">${[['consulta','Consulta'],['vacina','Vacinação'],['urgencia','Urgência'],['outro','Outros']].map(([k,v])=>`<button class="node" onclick="edit('${k}')">${v}<br><small class="muted">Editar resposta</small></button>`).join('')}</div><div class="arrow"></div><div class="node">Encaminhamento humano</div></div></div><div class="card"><h2>Simulador de WhatsApp</h2><div class="messages"><div class="bubble out">${esc(db.flows.start)}</div>${test.map(([m,o])=>`<div class="bubble ${o?'out':''}">${esc(m)}</div>`).join('')}</div><label>Escolha um cenário</label><div class="compose"><select id="scenario"><option value="consulta">Agendar consulta</option><option value="vacina">Vacinação</option><option value="urgencia">Urgência</option><option value="outro">Outros assuntos</option></select><button onclick="simulate()">Testar</button></div><button class="secondary" style="margin-top:10px" onclick="test=[];render()">Reiniciar teste</button></div></div><div class="notice">Fluxo fixo editável para demonstração. Não interpreta sintomas nem realiza diagnóstico.</div>`;
if(screen==='assistant')h=title('Assistente virtual','Personalize as mensagens da sua clínica.')+`<div class="card"><label>Nome do assistente</label><input id="an" value="${esc(db.assistant)}">${Object.entries(db.flows).map(([k,v])=>`<label>${k}</label><textarea id="f${k}">${esc(v)}</textarea>`).join('')}<button onclick="saveAssistant()">Salvar configuração</button></div>`;
if(screen==='campaign')h=title('Campanhas','Planeje comunicações preventivas autorizadas.')+`<div class="two"><div class="card"><h2>Nova campanha</h2><label>Nome</label><input id="cn" placeholder="Retorno preventivo"><label>Mensagem</label><textarea id="cm"></textarea><p>${db.people.filter(p=>p.consent).length} contatos demonstrativos com consentimento.</p><button onclick="campaign()">Simular campanha</button></div><div class="card"><h2>Histórico</h2>${db.campaigns.map(c=>row(esc(c.name),esc(c.count)+' destinatários · simulado')).join('')||'<p>Nenhuma campanha criada.</p>'}</div></div>`;
if(screen==='agenda')h=title('Agendamentos','Solicitações aguardando confirmação humana.')+`<div class="card"><label>Paciente</label><select id="ap">${db.people.map(p=>`<option>${esc(p.pet)}</option>`).join('')}</select><label>Data e horário</label><input id="ad" type="datetime-local"><button style="margin-top:12px" onclick="appointment()">Criar solicitação</button>${db.agenda.map((a,i)=>row(esc(a.pet)+' · '+esc(a.date),a.done?'Confirmado':`<button onclick="confirmAppointment(${i})">Confirmar</button>`)).join('')}</div>`;
if(screen==='contacts')h=title('Contatos','Gerencie os contatos e as preferências de comunicação.')+`<div class="card"><div class="compose"><input id="pn" placeholder="Nome do responsável"><input id="pp" placeholder="Animal"><button onclick="addPerson()">Cadastrar</button></div>${db.people.map((p,i)=>row(esc(p.name)+' · '+esc(p.pet),`<button class="secondary" onclick="consent(${i})">${p.consent?'Consentimento registrado':'Sem consentimento'}</button>`)).join('')}</div>`;$('#page').innerHTML=h}
function send(){let m=$('#message').value.trim();if(!m)return;db.people[current].msg.push(m);save();render();toast('Mensagem simulada registrada')}function assign(){let v=prompt('Nome do profissional responsável');if(v?.trim()){db.people[current].owner=v.trim();save();render()}}function labelChat(){let v=prompt('Etiqueta do atendimento');if(v?.trim()){db.people[current].label=v.trim();save();render()}}function note(){let v=prompt('Nota interna');if(v?.trim()){(db.people[current].notes??=[]).push(v.trim());save();render()}}function edit(k){let v=prompt('Editar mensagem',db.flows[k]);if(v?.trim()){db.flows[k]=v.trim();save();render()}}function simulate(){let s=$('#scenario');test.push([s.options[s.selectedIndex].text,false],[db.flows[s.value],true]);render()}function saveAssistant(){db.assistant=$('#an').value;Object.keys(db.flows).forEach(k=>db.flows[k]=$('#f'+k).value);save();toast('Configuração salva')}function campaign(){let name=$('#cn').value.trim(),message=$('#cm').value.trim();if(!name||!message)return toast('Preencha nome e mensagem');db.campaigns.push({name,message,count:db.people.filter(p=>p.consent).length});save();render();toast('Campanha simulada, nenhuma mensagem enviada')}function appointment(){let date=$('#ad').value;if(!date)return toast('Informe data e horário');db.agenda.push({pet:$('#ap').value,date,done:false});save();render()}function confirmAppointment(i){db.agenda[i].done=true;save();render()}function addPerson(){let name=$('#pn').value.trim(),pet=$('#pp').value.trim();if(!name||!pet)return toast('Preencha os dois campos');db.people.push({name,pet,consent:false,msg:[]});save();render()}function consent(i){db.people[i].consent=!db.people[i].consent;save();render()}render();
</script></html>
