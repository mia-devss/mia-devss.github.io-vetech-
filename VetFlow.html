function openModal(html){$('modal').innerHTML=`<button class="btn secondary close" onclick="$('modal').close()">✕</button>${html}`;if(!$('modal').open)$('modal').showModal()}function logs(b){return b.logs.slice().reverse().map(l=>`<div class="line"><small>${esc(l.time)} · ${esc(l.by)}</small><p>${esc(l.type)}: ${esc(l.text)}</p></div>`).join('')||'<p class="muted">Sem registros adicionais.</p>'}function oldPatient(id){let b=state.find(x=>x.id===id);if(!b.name)return admit(id);openModal(`<p class="tag">LEITO ${id} / ${esc(b.sector)}</p><h1>${esc(b.name)}</h1><p>${esc(b.species)} · ${esc(b.weight)} kg · ${esc(b.status)}</p><p>${esc(b.reason)} · MV: ${esc(b.vet)}</p><div class="toolbar"><button class="btn" onclick="record(${id},'Parâmetros')">＋ Parâmetros</button><button class="btn secondary" onclick="record(${id},'Evolução')">Evolução</button><button class="btn secondary" onclick="record(${id},'Medicação prescrita / administração')">Medicação</button><button class="btn secondary" onclick="record(${id},'Alimentação e eliminações')">Alimentação</button><button class="btn secondary" onclick="record(${id},'Fluidoterapia')">Fluidos</button><button class="btn secondary" onclick="record(${id},'Passagem de plantão')">Plantão</button><button class="btn secondary" onclick="addTask(${id})">Tarefa</button><button class="btn secondary" onclick="move(${id})">Transferir leito</button></div><h3>Histórico assistencial</h3>${logs(b)}`)}function record(id,type){openModal(`<h2>${esc(type)}</h2><form onsubmit="event.preventDefault();commit(${id},'${type}',this)">${type==='Parâmetros'?'<label>FC (bpm)<input name="fc" type="number"></label><label>FR (irpm)<input name="fr" type="number"></label><label>Temperatura (°C)<input name="temp" type="number" step="0.1"></label><label>SpO₂ (%)<input name="spo" type="number"></label>':''}<label>Registro / observação<textarea name="note" required></textarea></label><label>Profissional responsável<input name="by" required></label><button class="btn">Salvar registro</button></form>`)}function commit(id,type,f){let d=new FormData(f),text=d.get('note');if(type==='Parâmetros')text=['fc','fr','temp','spo'].map((k,i)=>d.get(k)?['FC','FR','Temp','SpO₂'][i]+': '+d.get(k):'').filter(Boolean).join(' · ')+' | '+text;state.find(b=>b.id===id).logs.push({type,text,by:d.get('by'),time:new Date().toLocaleString('pt-BR')});save();patient(id,type)}function admit(id){let free=state.filter(b=>!b.name);if(!free.length)return alert('Sem leitos disponíveis');openModal(`<h2>Nova internação</h2><form onsubmit="event.preventDefault();admitSave(this)"><label>Leito<select name="id">${free.map(b=>`<option value="${b.id}" ${b.id===id?'selected':''}>${b.id} · ${b.sector}</option>`).join('')}</select></label><label>Paciente<input name="name" required></label><label>Espécie<select name="species"><option>Cão</option><option>Gato</option><option>Outro</option></select></label><label>Peso (kg)<input name="weight" type="number" min="0.01" step="0.01" required></label><label>Classificação registrada<select name="status">${Object.keys(colors).filter(s=>s!=='Disponível').map(s=>`<option>${s}</option>`).join('')}</select></label><label>Motivo<input name="reason" required></label><label>Médico-veterinário<input name="vet" required></label><label>Profissional responsável pelo registro<input name="by" required></label><button class="btn">Confirmar internação</button></form>`)}function admitSave(f){let d=Object.fromEntries(new FormData(f)),b=state.find(x=>x.id===+d.id);let {id,by,...data}=d;Object.assign(b,data);b.logs=[{type:'Admissão',text:data.reason,by,time:new Date().toLocaleString('pt-BR')}];b.tasks=[];save();patient(b.id)}function complete(id,i){let by=prompt('Nome do profissional responsável:');if(!by?.trim())return;let b=state.find(x=>x.id===id);Object.assign(b.tasks[i],{done:true,by});b.logs.push({type:'Tarefa concluída',text:b.tasks[i].name,by,time:new Date().toLocaleString('pt-BR')});save()}function addTask(id){let name=prompt('Descrição da tarefa:');if(!name?.trim())return;let by=prompt('Profissional responsável pelo registro:');if(!by?.trim())return;let b=state.find(x=>x.id===id);b.tasks.push({name,done:false});b.logs.push({type:'Tarefa criada',text:name,by,time:new Date().toLocaleString('pt-BR')});save();if($('modal').open)patient(id)}function move(id){let free=state.filter(b=>!b.name);if(!free.length)return alert('Sem leitos disponíveis');let target=Number(prompt('Leito de destino: '+free.map(b=>b.id).join(', ')));let dst=free.find(b=>b.id===target);if(!dst)return;let by=prompt('Profissional responsável:');if(!by?.trim())return;let src=state.find(b=>b.id===id),{id:old,sector,...data}=src;Object.assign(dst,data);dst.logs.push({type:'Transferência',text:'Leito '+id+' → '+target,by,time:new Date().toLocaleString('pt-BR')});Object.assign(src,{name:'',species:'',weight:'',reason:'',status:'Disponível',logs:[],tasks:[],meds:[],allergies:''});save();patient(target)}function handover(){let by=prompt('Profissional responsável pela conferência:');if(!by?.trim())return;localStorage.setItem('vetflow-handover','Conferido por '+by+' · '+new Date().toLocaleString('pt-BR'));render()}
const sections=['Visão geral','Prescrição','Parâmetros','Enfermagem','Nutrição','Eliminações','Fluidoterapia','Dispositivos','Exames','Evolução','Alta'];
function patient(id,tab='Visão geral'){let b=state.find(x=>x.id===id);if(!b.name)return admit(id);let content='';let items=b.logs.filter(l=>l.type===tab);let history=items.length?items.slice().reverse().map(l=>`<div class="line"><small>${esc(l.time)} · ${esc(l.by)}</small><p>${esc(l.text)}</p></div>`).join(''):'<div class="empty">Nenhum registro nesta seção.</div>';
if(tab==='Visão geral')content=`<div class="grid"><div class="card"><small>Peso</small><h2>${esc(b.weight)} kg</h2></div><div class="card"><small>Espécie</small><h2>${esc(b.species)}</h2></div><div class="card"><small>Classificação</small><h2>${esc(b.status)}</h2></div><div class="card"><small>Pendências</small><h2>${b.tasks.filter(t=>!t.done).length}</h2></div></div><div class="panel"><h3>Alergias e restrições</h3><p>${esc(b.allergies||'Não informado — conferir com a equipe')}</p><button class="btn secondary" onclick="allergy(${id})">Atualizar restrições</button></div><div class="toolbar"><button class="btn secondary" onclick="move(${id})">Transferir leito</button><button class="btn secondary" onclick="addTask(${id})">Nova tarefa</button></div><h3>Histórico assistencial</h3>${logs(b)}`;
else if(tab==='Prescrição'){let meds=b.meds||[];content=`<div class="row"><h3>Prescrição e aprazamento</h3><button class="btn" onclick="prescribe(${id})">+ Registrar prescrição</button></div><p class="muted">Registro manual de prescrição fictícia. Nenhuma dose é sugerida pelo sistema.</p><div class="scroll"><table><thead><tr><th>Medicamento / dose prescrita</th><th>Via</th><th>Horário</th><th>Situação</th></tr></thead><tbody>${meds.map((m,i)=>`<tr><td>${esc(m.name)}<br><small>${esc(m.dose)} · ${esc(m.by)}</small></td><td>${esc(m.route)}</td><td>${esc(m.hour)}</td><td>${m.done?esc(m.done):`<button class="btn secondary" onclick="adminMed(${id},${i})">Registrar administração</button>`}</td></tr>`).join('')}</tbody></table></div>${meds.length?'':'<div class="empty">Nenhuma prescrição registrada.</div>'}`}
else if(tab==='Parâmetros'){let v=(b.logs||[]).filter(l=>l.type==='Parâmetros').map(l=>Number((l.text.match(/Temp: ([\d.]+)/)||[])[1])).filter(Number.isFinite);let pts=v.map((n,i)=>`${20+i*260/Math.max(1,v.length-1)},${120-(n-Math.min(...v))*90/Math.max(.1,Math.max(...v)-Math.min(...v))}`).join(' ');content=`<div class="row"><h3>Evolução de temperatura</h3><button class="btn" onclick="record(${id},'Parâmetros')">+ Aferição</button></div>${v.length?`<svg class="chart" viewBox="0 0 300 145" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#398b80" stroke-width="2"/>${pts.split(' ').map(pt=>`<circle cx="${pt.split(',')[0]}" cy="${pt.split(',')[1]}" r="3" fill="#398b80"/>`).join('')}</svg><p class="muted">Temperaturas registradas: ${v.join(' · ')} °C</p>`:'<div class="empty">Registre temperaturas para visualizar a evolução.</div>'}${history}`}
else if(tab==='Alta')content=`<h3>Resumo da internação</h3>${logs(b)}<button class="btn secondary" onclick="window.print()">Imprimir resumo</button>`;
else content=`<div class="row"><h3>${tab}</h3><button class="btn" onclick="record(${id},'${tab}')">+ Novo registro</button></div>${history}`;
openModal(`<p class="tag">FICHA DE INTERNAÇÃO / LEITO ${id} / ${esc(b.sector)}</p><h1>${esc(b.name)} <span class="pill" style="--status:${colors[b.status]}">${esc(b.status)}</span></h1><p class="muted">${esc(b.reason)} · MV: ${esc(b.vet)}</p><div class="tabs">${sections.map(t=>`<button class="${t===tab?'sel':''}" onclick="patient(${id},'${t}')">${t}</button>`).join('')}</div>${content}`)}
function allergy(id){let a=prompt('Alergias e restrições:');if(a===null)return;let by=prompt('Profissional responsável:');if(!by?.trim())return;let b=state.find(x=>x.id===id);b.allergies=a;b.logs.push({type:'Restrições',text:a,by,time:new Date().toLocaleString('pt-BR')});save();patient(id)}
function prescribe(id){openModal(`<h2>Registrar prescrição existente</h2><form onsubmit="event.preventDefault();saveMed(${id},this)"><div class="formgrid"><label>Medicamento<input name="name" required></label><label>Dose prescrita<input name="dose" required></label><label>Via<input name="route" required></label><label>Horário previsto<input type="time" name="hour" required></label></div><label>Médico-veterinário responsável<input name="by" required></label><button class="btn">Salvar prescrição</button></form>`)}
function saveMed(id,f){let b=state.find(x=>x.id===id);(b.meds??=[]).push(Object.fromEntries(new FormData(f)));save();patient(id,'Prescrição')}
function adminMed(id,i){let by=prompt('Profissional responsável pela administração:');if(!by?.trim())return;let b=state.find(x=>x.id===id),m=b.meds[i];if(m.done)return;m.done='Administrada · '+by+' · '+new Date().toLocaleString('pt-BR');b.logs.push({type:'Administração',text:m.name+' · '+m.dose,by,time:new Date().toLocaleString('pt-BR')});save();patient(id,'Prescrição')}
render();</script></html>
