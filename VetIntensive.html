<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VetIntensive — Critical Care</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#172a35;font:14px system-ui,sans-serif}header{background:#142c38;color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px;letter-spacing:-1px}small{font-size:11px;letter-spacing:1.5px;text-transform:uppercase}nav{display:flex;overflow:auto;gap:25px;padding:0 5%;border-bottom:1px solid #cdd4d0;background:#fff}button,input,select{font:inherit}button{cursor:pointer;border:0;background:#163c47;color:white;padding:12px 17px;border-radius:3px}nav button{background:none;color:#50636b;white-space:nowrap;border-radius:0;padding:19px 0}nav button.active{border-bottom:3px solid #137c79;color:#137c79}main{max-width:1450px;margin:auto;padding:32px 5%}h1{font:normal clamp(36px,6vw,72px) Georgia;letter-spacing:-2px;margin:12px 0}h2{font:normal 30px Georgia;margin:24px 0 12px}p{line-height:1.6;color:#52656b}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}.stats{display:flex;gap:30px;flex-wrap:wrap;border-block:1px solid #cdd4d0;padding:24px 0;margin:25px 0}.stats div{flex:1;min-width:120px}.stats b{display:block;font:42px Georgia}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:16px 12px;border-bottom:1px solid #d7ded9}th{font-size:11px;letter-spacing:1px;color:#60747b;text-transform:uppercase}tbody tr:hover{background:#e5ede8}a,.link{color:#137c79;cursor:pointer;text-decoration:underline}.tag{color:#a34b30;font-weight:bold}.muted{color:#667b80}.split{display:grid;grid-template-columns:2fr 1fr;gap:36px}.line{border-bottom:1px solid #ccd7d3;padding:15px 0}.chart{width:100%;height:180px;background:linear-gradient(#dce4df 1px,transparent 1px);background-size:100% 45px}form{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0}label{display:grid;gap:6px;font-size:12px}input,select{border:1px solid #aebfba;background:white;padding:10px;max-width:100%}.notice{background:#e3eae4;padding:12px 5%;font-size:12px}footer{padding:25px 5%;color:#667b80;border-top:1px solid #ccd7d3}dialog{border:1px solid #bac9c4;padding:24px;max-width:90vw} @media(max-width:700px){.split{grid-template-columns:1fr}main{padding:22px 4%}header{padding:15px 4%}header small{display:none}} </style><header><strong>vetintensive<span style="color:#69d5bf">.</span></strong><small>Critical care / estação assistencial</small><span>UTI · DEMO</span></header><div class="notice">AMBIENTE DEMONSTRATIVO — dados fictícios, sem conexão a equipamentos. Não utilizar para assistência clínica.</div><nav id="nav"></nav><main id="app"></main><footer>VETINTENSIVE / 008 — Editorial Clinical Technology · Protótipo de portfólio</footer><script>
const names=['Thor','Luna','Simba','Maya','Nina','Max','Oliver','Amora'];const metrics=['FC (bpm)','FR (rpm)','PAM (mmHg)','SpO₂ (%)','Temperatura (°C)','Lactato (mmol/L)'];const base=[142,28,65,96,37.8,4.2];let data;try{data=JSON.parse(localStorage.getItem('vetintensive-demo-v1'))}catch{};if(!data)data=names.map((name,i)=>({name,bed:i+1,species:i%2?'Felino':'Canino',weight: i%2?4.5:18+i,records:Array.from({length:5},(_,j)=>({time:`${8+j}:00`,values:base.map((v,k)=>k===4?+(v+j*.1).toFixed(1):k===5?+(v-j*.2).toFixed(1):v+(k===0?-j*3+i:k===2?j*2+i:0)),who:'Equipe DEMO'})),events:[]}));let selected=0,page='Panorama',start=null;const tabs=['Panorama','Flowsheet','Infusões','Respiratório','Balanço hídrico','Laboratório','Dispositivos','Rondas','Emergência','Plantão'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('vetintensive-demo-v1',JSON.stringify(data));const p=()=>data[selected];const last=x=>x.records.at(-1);function go(t){page=t;render()}function pick(i){selected=+i;go('Flowsheet')}function table(h,r){return `<div class="scroll"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function chart(k){let a=p().records.map(r=>r.values[k]).filter(Number.isFinite),lo=Math.min(...a)-1,hi=Math.max(...a)+1;return `<svg class="chart" viewBox="0 0 600 180" preserveAspectRatio="none"><polyline fill="none" stroke="#137c79" stroke-width="3" points="${a.map((v,i)=>`${i*600/Math.max(a.length-1,1)},${165-(v-lo)/(hi-lo)*150}`).join(' ')}"/></svg><small>${esc(metrics[k])} · escala ${lo.toFixed(1)} – ${hi.toFixed(1)}</small>`}function render(){nav.innerHTML=tabs.map(t=>`<button class="${page===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let x=p();let head=`<small>Unidade de terapia intensiva / 08 leitos</small><div class="hero"><h1>${page==='Panorama'?'Visão intensiva.':page+'.'}</h1>${page==='Panorama'?'':`<select onchange="selected=+this.value;render()">${data.map((q,i)=>`<option value="${i}" ${i===selected?'selected':''}>UTI ${q.bed} · ${q.name}</option>`).join('')}</select>`}</div>`;if(page==='Panorama'){app.innerHTML=head+`<p>Estação de acompanhamento • registros manuais simulados</p><div class="stats"><div><small>Ocupação</small><b>8 / 8</b></div><div><small>Registros</small><b>${data.reduce((s,q)=>s+q.records.length,0)}</b></div><div><small>Intervenções documentadas</small><b>${data.reduce((s,q)=>s+q.events.length,0)}</b></div></div><h2>Pacientes em acompanhamento</h2>`+table(['Leito','Paciente',...metrics,'Último registro'],data.map((q,i)=>[`0${q.bed}`,`<a onclick="pick(${i})">${q.name}</a><br><small>${q.species}</small>`,...last(q).values.map(v=>esc(v)),esc(last(q).time)]));return}head+=`<p>UTI 0${x.bed} / <b>${x.name}</b> · ${x.species} · ${x.weight} kg · identificação fictícia</p>`;if(page==='Flowsheet'){app.innerHTML=head+`<div class="split"><section><h2>Tendência hemodinâmica</h2><select id="metric" onchange="document.getElementById('graph').innerHTML=chart(+this.value)">${metrics.map((m,i)=>`<option value="${i}">${m}</option>`)}</select><div id="graph">${chart(0)}</div></section><section><h2>Última aferição</h2>${metrics.map((m,i)=>`<div class="line">${m} <b style="float:right">${last(x).values[i]}</b></div>`).join('')}</section></div><h2>Folha intensiva</h2>`+table(['Parâmetro',...x.records.map(r=>esc(r.time))],metrics.map((m,i)=>[m,...x.records.map(r=>esc(r.values[i]))]))+`<h2>Nova aferição</h2><form onsubmit="record(event)">${metrics.map((m,i)=>`<label>${m}<input required type="number" step="any" name="v${i}"></label>`).join('')}<label>Profissional<input required name="who"></label><button>Registrar</button></form><h2>Intervenções na linha temporal</h2>`+events(x.events);return}let config={ 'Infusões':['Medicamento / solução prescrita','Velocidade registrada (mL/h)','Volume restante (mL)'],'Respiratório':['Modalidade / suporte','Parâmetros registrados','Observação'],'Balanço hídrico':['Tipo (entrada ou saída)','Volume medido (mL)','Origem'],'Laboratório':['Exame','Resultado e unidade','Referência do laboratório'],'Dispositivos':['Dispositivo','Localização','Instalação / avaliação / retirada'],'Rondas':['Meta definida pelo intensivista','Situação','Observação'],'Emergência':['Evento observado','Intervenção realizada','Observação'],'Plantão':['Profissional que recebe','Pendências','Resumo assistencial']};let fields=config[page];let ev=x.events.filter(e=>e.type===page);app.innerHTML=head+(page==='Emergência'?`<button onclick="start=Date.now();render()">Iniciar cronômetro</button> <button onclick="start=null;render()">Encerrar</button> <b id="timer">${start?'Em andamento':'Inativo'}</b>`:'')+(page==='Balanço hídrico'?`<div class="stats"><div><small>Entradas registradas (mL)</small><b>${sum(ev,'entrada')}</b></div><div><small>Saídas registradas (mL)</small><b>${sum(ev,'saída')}</b></div><div><small>Saldo parcial (mL)</small><b>${sum(ev,'entrada')-sum(ev,'saída')}</b></div></div>`:'')+`<h2>Documentação assistencial</h2><form onsubmit="add(event)">${fields.map((f,i)=>`<label>${f}${page==='Balanço hídrico'&&i===0?'<select name="f0"><option>entrada</option><option>saída</option></select>':`<input required name="f${i}" ${page==='Balanço hídrico'&&i===1?'type="number" min="0" step="any"':''}>`}</label>`).join('')}<label>Profissional responsável<input required name="who"></label><button>Salvar registro</button></form><h2>Histórico</h2>`+events(ev);}
function sum(ev,t){return ev.filter(e=>e.f[0]===t).reduce((s,e)=>s+Number(e.f[1]),0)}function events(ev){return table(['Data / horário','Área','Registro','Responsável'],ev.slice().reverse().map(e=>[esc(e.time),esc(e.type),esc(e.f.join(' · ')),esc(e.who)]))+(ev.length?'':'<p>Nenhum registro nesta seção.</p>')}function record(e){e.preventDefault();let f=new FormData(e.target);p().records.push({time:new Date().toLocaleString('pt-BR'),values:metrics.map((_,i)=>Number(f.get('v'+i))),who:f.get('who')});p().events.push({type:'Aferição',time:last(p()).time,f:last(p()).values.map((v,i)=>metrics[i]+': '+v),who:f.get('who')});save();render()}function add(e){e.preventDefault();let f=new FormData(e.target);p().events.push({type:page,time:new Date().toLocaleString('pt-BR'),f:[f.get('f0'),f.get('f1'),f.get('f2')],who:f.get('who')});save();render()}setInterval(()=>{let t=document.getElementById('timer');if(t&&start)t.textContent=Math.floor((Date.now()-start)/1000)+' s'},500);render();</script></html>
