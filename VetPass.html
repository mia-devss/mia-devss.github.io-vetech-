n onclick="detail(${r.id})">Detalhes</button></div></div>`).join(''):'<p>Nenhum registro.</p>'}function render(){ $('app').className=mode==='owner'?'owner-mode':''; $('clinicBtn').className=mode==='clinic'?'active':'';$('ownerBtn').className=mode==='owner'?'active':'';if(mode==='owner'){let p=pet(selected)||data.pets[0],rs=data.records.filter(r=>r.pet===p.id);$('app').innerHTML=`<div class="eyebrow">MINHA SAÚDE ANIMAL</div><h1>Olá, ${esc(p.owner.split(' ')[0])}.</h1><p>Uma nova forma de acompanhar a saúde de quem você ama.</p><label>Selecionar animal<select onchange="selected=+this.value;render()">${data.pets.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><section class="hero"><div class="eyebrow" style="color:#b8d7ca">CARTEIRA DIGITAL · DEMONSTRAÇÃO</div><div class="flex" style="margin-top:20px"><div class="avatar">${esc(p.name[0])}</div><div><h1>${esc(p.name)}</h1><p>${esc(p.species)} · ${esc(p.breed)}</p></div></div><div class="wallet-meta">IDENTIDADE DIGITAL · VP-${p.id}</div><p>Clínica Aurora · Carteira demonstrativa</p><button onclick="window.print()">Imprimir carteira</button></section><div class="card"><h2>Próximos cuidados</h2>${records(rs.filter(due))}</div><div class="card"><h2>Histórico de saúde</h2>${records(rs)}</div><div class="card"><h2>Contato e documentos</h2><p>Compartilhamento e contato real indisponíveis nesta demonstração.</p><button onclick="show('Compartilhamento demonstrativo','<p>Identificador local VP-${p.id}. A verificação pública por QR Code será implementada com autenticação e servidor.</p>')">Compartilhar carteira</button></div>`;return}let upcoming=data.records.filter(due);$('app').innerHTML=`<div class="eyebrow">GESTÃO PREVENTIVA / AURORA</div><h1>Visão de cuidado.</h1><p>Acompanhe pacientes, aplicações e retornos em um só lugar.</p><nav class="noprint">${[['overview','Visão geral'],['patients','Pacientes'],['records','Aplicações'],['reminders','Lembretes'],['audit','Histórico']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="switchTab('${k}')">${n}</button>`).join('')}</nav><div style="margin-top:24px">${tab==='overview'?`<div class="grid">${[['Pacientes cadastrados',data.pets.length],['Cuidados registrados',data.records.length],['Retornos em 30 dias ou atrasados',upcoming.length]].map(([n,v])=>`<div class="card"><p>${n}</p><div class="number">${v}</div></div>`).join('')}</div><section class="hero"><span class="eyebrow" style="color:#b8d7ca">CUIDADO CONTÍNUO</span><h2>Uma jornada de cuidado conectada.</h2><p>Registre uma aplicação e atualize a carteira digital do paciente.</p><button onclick="recordForm()">+ Nova aplicação</button></section><div class="card"><h2>Retornos prioritários</h2>${records(upcoming)}</div>`:tab==='patients'?`<div class="card"><div class="row"><h2>Pacientes</h2><button class="primary" onclick="petForm()">+ Cadastrar</button></div><input placeholder="Pesquisar paciente ou responsável" oninput="filterPatients(this.value)"><div id="patientList">${patientRows(data.pets)}</div></div>`:tab==='records'?`<div class="card"><div class="row"><h2>Aplicações registradas</h2><button class="primary" onclick="recordForm()">+ Registrar</button></div>${records(data.records)}</div>`:tab==='reminders'?`<div class="card"><h2>Central de lembretes</h2><p>Envio simulado, sem comunicação externa.</p>${upcoming.map(r=>`<div class="row"><div><strong>${esc(pet(r.pet)?.name)} · ${esc(r.name)}</strong><p>${date(r.next)} · ${status(r)}</p></div><button onclick="remind(${r.id})">${data.reminders.some(x=>x.id===r.id)?'Simular novamente':'Simular lembrete'}</button></div>`).join('')||'Nenhum retorno próximo.'}</div>`:`<div class="card"><h2>Histórico de registros</h2>${data.records.map(r=>`<div class="row"><div>${esc(r.vet)} — ${esc(r.name)}<p>${esc(pet(r.pet)?.name)} · ${esc(r.created)}</p></div><span class="pill">Aplicação cadastrada</span></div>`).join('')}${data.reminders.map(r=>`<div class="row">Lembrete simulado · ${esc(r.time)}</div>`).join('')}</div>`}</div>`}function patientRows(ps){return ps.map(p=>`<div class="row"><div class="flex"><div class="avatar">${esc(p.name[0])}</div><div><strong>${esc(p.name)}</strong><p>${esc(p.species)} · ${esc(p.owner)}</p></div></div><button onclick="selected=${p.id};view('owner')">Ver carteira</button></div>`).join('')}function filterPatients(q){$('patientList').innerHTML=patientRows(data.pets.filter(p=>(p.name+' '+p.owner).toLowerCase().includes(q.toLowerCase())))}function show(title,body){$('modalBody').innerHTML='<h2>'+title+'</h2>'+body;$('modal').showModal()}function detail(id){let r=data.records.find(x=>x.id===id);show(esc(r.name),Object.entries({Paciente:pet(r.pet)?.name,Aplicação:date(r.date),Retorno:date(r.next),Fabricante:r.maker,Lote:r.lot,Validade:date(r.expiry),Veterinário:r.vet,CRMV:r.crmv}).map(([k,v])=>`<div class="row"><span>${k}</span><strong>${esc(v)}</strong></div>`).join(''))}function field(n,l,t='text',required=true){return `<label>${l}<input name="${n}" type="${t}" ${required?'required':''}></label>`}function petForm(){show('Novo paciente',`<form onsubmit="addPet(event)">${field('name','Nome')}<label>Espécie<select name="species"><option>Canina</option><option>Felina</option><option>Outra</option></select></label>${field('breed','Raça')}${field('owner','Responsável')}<button class="primary">Salvar paciente</button></form>`)}function addPet(e){e.preventDefault();data.pets.push({id:Date.now(),...Object.fromEntries(new FormData(e.target))});save();modal.close();render()}function recordForm(){show('Registrar cuidado',`<form onsubmit="addRecord(event)"><label>Paciente<select name="pet">${data.pets.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Tipo<select name="type"><option>Vacina</option><option>Vermifugação</option><option>Antiparasitário</option></select></label>${field('name','Produto / aplicação')}${field('date','Data da aplicação','date')}${field('next','Retorno definido pelo veterinário','date',false)}${field('maker','Fabricante')}${field('lot','Lote')}${field('expiry','Validade do produto','date')}${field('vet','Médico-veterinário')}${field('crmv','CRMV')}<button class="primary">Salvar aplicação</button></form>`)}function addRecord(e){e.preventDefault();let r=Object.fromEntries(new FormData(e.target));if(r.expiry<r.date||r.date>today()||(r.next&&r.next<r.date)){alert('Confira as datas de aplicação, validade e retorno.');return}data.records.unshift({...r,id:Date.now(),pet:+r.pet,created:new Date().toLocaleString('pt-BR')});save();modal.close();render()}function remind(id){data.reminders.push({id,time:new Date().toLocaleString('pt-BR')});save();render();alert('Lembrete simulado. Nenhuma mensagem foi enviada.')}render();</script></html>
