const seed={b:[{id:1,name:'Dipirona',lot:'AU-2401',initial:20,left:13.5,unit:'mL',cost:2.4,expiry:relative(90),useUntil:relative(4),opened:relative(0),by:'Ana Carvalho',controlled:false},{id:2,name:'Cetamina',lot:'AU-2402',initial:50,left:8,unit:'mL',cost:1.8,expiry:relative(90),useUntil:relative(-1),opened:relative(-2),by:'Pedro Lima',controlled:true},{id:3,name:'Lidocaína',lot:'AU-2403',initial:30,left:24,unit:'mL',cost:3.2,expiry:relative(90),useUntil:relative(4),opened:relative(0),by:'Julia Santos',controlled:false}],logs:[{type:'Dispensação',name:'Dipirona',patient:'Thor',qty:6.5,unit:'mL',cost:15.6,by:'Ana Carvalho',date:'19/11/2026 08:30',note:'Registro demonstrativo',lot:'AU-2401'}],temps:[],checks:[]};let s;try{s=JSON.parse(localStorage.vetpharma_v2)||structuredClone(seed)}catch{s=structuredClone(seed)}const nav=document.getElementById('nav'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),content=document.getElementById('content'),modal=document.getElementById('modal'),ft=document.getElementById('ft'),fields=document.getElementById('fields');let page='Visão geral';const pages=['Visão geral','Medicamentos','Frascos abertos','Dispensação','Controlados','Cadeia fria','Perdas e descartes','Conferência','Custos','Auditoria'];const icons=['◫','▤','◉','↗','◇','❄','↘','✓','▥','≡'];const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=n=>Number(n.toFixed(3));const sum=(a,k)=>a.reduce((t,o)=>t+(o[k]||0),0);const save=()=>{localStorage.vetpharma_v2=JSON.stringify(s);render()};function reset(){if(confirm('Restaurar dados fictícios?')){s=structuredClone(seed);save()}}function go(p){page=p;render()}function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+e(x)+'</th>').join('')+'</tr></thead><tbody>'+ (rows.length?rows.map(r=>'<tr>'+r.map(x=>'< ado'],['Vencidos / bloqueados',s.b.filter(b=>b.left>0&&!valid(b)).length,'Revisar antes de utilizar']].map(a=>`<div class="card"><small>${a[0]}</small><strong>${a[1]}</strong><small>${a[2]}</small></div>`).join('')}</div><div class="alertstrip"><div><b>Frascos abertos disponíveis</b><p>${s.b.filter(valid).length} frasco(s) com prazo informado vigente e saldo. Confira integridade e armazenamento antes do uso.</p></div><button onclick="go('Frascos abertos')">Ver frascos →</button></div><div class="split"><section class="panel"><div class="row"><h2>Frascos em utilização</h2><button onclick="form('open')">+ Abrir frasco</button></div>${bottles(s.b.slice(0,4))}</section><section class="panel"><h2>Distribuição do volume restante</h2>${s.b.map(b=>`<div class="row"><span>${e(b.name)}</span><b>${b.left} mL</b></div><div class="bar"><i style="width:${100*b.left/b.initial}%"></i></div>`).join('')}<hr style="border:0;border-top:1px solid #eee;margin:25px 0"><h2>Custo de perdas</h2><strong style="font-size:30px">${money(sum(w,'cost'))}</strong><p>Desperdícios registrados pela equipe.</p><button onclick="form('waste')">Registrar descarte</button></section></div><section class="panel"><h2>Movimentações recentes</h2>${logtable(s.logs.slice(0,5))}</section>`}else if(['Medicamentos','Frascos abertos','Controlados'].includes(page)){let a=page==='Controlados'?s.b.filter(x=>x.controlled):s.b;html=`<section class="panel"><div class="row"><h2>${page}</h2><button class="primary" onclick="form('open')">+ Abrir frasco</button></div><input class="search" placeholder="Pesquisar medicamento ou lote" oninput="document.getElementById('results').innerHTML=bottles(${page==='Controlados'?'s.b.filter(b=>b.controlled)':'s.b'}.filter(b=>(b.name+' '+b.lot).toLowerCase().includes(this.value.toLowerCase())))"><div id="results">${bottles(a)}</div></section>`}else if(page==='Dispensação'||page==='Perdas e descartes'||page==='Auditoria'){html=`<section class="panel"><div class="row"><h2>Histórico de registros</h2>${page==='Perdas e descartes'?'<button onclick="form(\'waste\')">+ Descarte</button>':''}</div>${logtable(page==='Dispensação'?d:page==='Perdas e descartes'?w:s.logs)}</section>`}else if(page==='Cadeia fria'){html=`<section class="panel"><div class="row"><h2>Monitoramento de temperatura</h2><button onclick="form('temp')">+ Medição</button></div>${table(['Equipamento','Temperatura °C','Profissional','Data','Observações'],s.temps.map(t=>[t.name,t.qty,t.by,t.date,t.note]))}</section>`}else if(page==='Conferência'){html=`<section class="panel"><div class="row"><h2>Conferências de plantão</h2><button onclick="form('check')">+ Conferência</button></div>${table(['Entrega','Recebimento','Condição','Data','Observações'],s.checks.map(t=>[t.by,t.patient,t.name,t.date,t.note]))}</section>`}else{let patients=[...new Set(d.map(l=>l.patient))];html=`<section class="panel"><h2>Custo por paciente</h2>${table(['Paciente','Custo registrado'],patients.map(p=>[p,money(sum(d.filter(l=>l.patient===p),'cost'))]))}</section>`}content.innerHTML=html}
function field(n,label,type='text',extra=''){return `<label>${label}<input name="${n}" type="${type}" required ${extra}></label>`}let mode;function form(m,id){mode=m;ft.textContent={disp:'Nova dispensação',waste:'Registrar descarte',open:'Abrir frasco',temp:'Registrar temperatura',check:'Conferência de plantão'}[m];let f='';if(m==='disp'||m==='waste'){f='<label>Frasco e lote<select name="id" required>'+s.b.filter(b=>m==='disp'?valid(b):b.left>0).map(b=>`<option value="${b.id}" ${id===b.id?'selected':''}>${e(b.name)} · ${e(b.lot)} · ${b.left} mL</option>`).join('')+'</select></label>'+field('qty','Quantidade (mL)','number','min="0.001" step="0.001"')+(m==='disp'?field('patient','Paciente / identificação'):'')+field('note',m==='waste'?'Motivo do descarte':'Observação');}if(m==='open')f=field('name','Medicamento')+field('lot','Lote')+field('initial','Volume inicial (mL)','number','min="0.001" step="0.001"')+field('cost','Custo por mL (R$)','number','min="0" step="0.01"')+field('expiry','Validade original do fabricante','date')+field('useUntil','Prazo de utilização após abertura (validado pelo responsável)','date')+'<p>Informe o prazo conforme fabricante e protocolo aprovado. Não há prazo automático.</p><div id="reuse" class="notice"></div>'+'<label>Controle especial<select name="controlled"><option value="false">Não</option><option value="true">Sim</option></select></label>';if(m==='temp')f=field('name','Equipamento')+field('qty','Temperatura °C','number','step="0.1"')+field('note','Observações');if(m==='check')f=field('patient','Profissional que recebe')+'<label>Condição<select name="name"><option>Conferido sem divergência</option><option>Divergência identificada</option></select></label>'+field('note','Observações e pendências');fields.innerHTML=f+field('by',m==='check'?'Profissional que entrega':'Profissional responsável');modal.showModal();if(m==='open'){let n=fields.querySelector('[name=name]');n.oninput=()=>{let a=s.b.filter(b=>valid(b)&&b.name.toLowerCase().trim()===n.value.toLowerCase().trim());document.getElementById('reuse').textContent=a.length?'Atenção: já existe frasco aberto e válido deste medicamento. Confira apresentação, concentração e condições antes de abrir outro.':'Confira se há frasco aberto antes de abrir outro.'};n.oninput()}}
document.getElementById('recordForm').onsubmit=ev=>{ev.preventDefault();let v=Object.fromEntries(new FormData(ev.target));if(!v.by.trim()){alert('Informe o responsável.');return}let date=new Date().toLocaleString('pt-BR');if(mode==='disp'||mode==='waste'){let b=s.b.find(b=>b.id===+v.id),q=+v.qty;if(!b||q<=0||q>b.left||(mode==='disp'&&!valid(b))){alert('Quantidade inválida ou saldo insuficiente.');return}b.left=num(b.left-q);s.logs.unshift({type:mode==='disp'?'Dispensação':'Descarte',name:b.name,lot:b.lot,patient:v.patient||'—',qty:q,unit:'mL',cost:q*b.cost,by:v.by,date,note:v.note})}else if(mode==='open'){if(v.expiry<relative(0)||v.useUntil<relative(0)||v.useUntil>v.expiry){alert('Confira as datas: o prazo de uso deve estar vigente e não ultrapassar a validade original.');return}if(s.b.some(b=>valid(b)&&b.name.trim().toLowerCase()===v.name.trim().toLowerCase())&&!confirm('Já existe frasco aberto e válido com este nome. Confirma a abertura de outro?'))return;let b={...v,id:Date.now(),initial:+v.initial,left:+v.initial,cost:+v.cost,unit:'mL',opened:relative(0),controlled:v.controlled==='true'};s.b.push(b);s.logs.unshift({type:'Abertura',name:b.name,lot:b.lot,patient:'—',qty:b.initial,unit:'mL',cost:0,by:v.by,date,note:'Abertura de frasco'})}else if(mode==='temp'){s.temps.unshift({...v,date});s.logs.unshift({type:'Temperatura',name:v.name,qty:v.qty,unit:'°C',by:v.by,date,note:v.note})}else{s.checks.unshift({...v,date});s.logs.unshift({type:'Conferência',name:v.name,patient:v.patient,qty:0,unit:'',by:v.by,date,note:v.note})}modal.close();save()};render();</script></html>
