</style><aside><h2>◈ VetStock<span style="color:#42d5b1">.</span></h2><small>HOSPITAL AURORA · DEMO</small><nav id="nav"></nav><button onclick="document.body.classList.toggle('dark')">◐ Alternar tema</button><p style="margin-top:24px"><small>Portfólio conceitual · dados fictícios</small></p></aside><main><header><div><small>OPERACIONAL / ESTOQUE</small><h1 id="title"></h1><span class="muted">Hospital Veterinário Aurora — ambiente demonstrativo</span></div><button onclick="move()">＋ Movimentação</button></header><div id="app"></div></main><dialog id="modal"><form method="dialog" id="form"></form></dialog><script>
const seed=[{n:'Seringa 5 mL',q:240,min:80,c:1.2,s:'Internação',l:'SR-240',v:'2028-05-10'},{n:'Luva de procedimento M',q:48,min:100,c:.65,s:'Centro cirúrgico',l:'LV-12',v:'2028-01-15'},{n:'Gaze estéril',q:180,min:50,c:2.4,s:'UTI',l:'GZ-21',v:'2026-12-01'},{n:'Cateter 22G',q:32,min:40,c:4.8,s:'Farmácia',l:'CT-22',v:'2027-09-20'},{n:'Solução fisiológica 500 mL',q:92,min:30,c:7.5,s:'Farmácia',l:'SF-90',v:'2027-03-15'}];let data=JSON.parse(localStorage.getItem('vetstockdemo')||'null')||{items:seed,logs:[],notes:[]},page='Visão geral';const app=document.querySelector('#app'),modal=document.querySelector('#modal'),form=document.querySelector('#form');const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('vetstockdemo',JSON.stringify(data));render()}const tabs=['Visão geral','Inventário','Movimentações','Notas fiscais','Fornecedores','Lotes e validades','Contagem','Alertas','Relatórios'];function go(p){page=p;render()}function soon(x){return (new Date(x.v)-new Date())/86400000<30}function table(items=data.items){return `<table><thead><tr><th>PRODUTO</th><th>SETOR</th><th>LOTE</th><th>QUANTIDADE</th><th>VALIDADE</th><th>STATUS</th></tr></thead><tbody>${items.map(x=>`<tr><td><b>${esc(x.n)}</b></td><td>${esc(x.s)}</td><td>${esc(x.l)}</td><td>${x.q} un.</td><td>${esc(x.v)}</td><td class="${x.q<x.min||soon(x)?'warn':'ok'}">${x.q<x.min?'Estoque baixo':soon(x)?'Revisar validade':'Regular'}</td></tr>`).join('')}</tbody></table>`}function render(){document.querySelector('#title').textContent=page;document.querySelector('#nav').innerHTML=tabs.map((t,i)=>`<button class="${t===page?'active':''}" onclick="go('${t}')">${['◫','▤','⇄','▧','◇','◷','✓','◉','▥'][i]}　${t}</button>`).join('');let low=data.items.filter(x=>x.q<x.min),exp=data.items.filter(soon),total=data.items.reduce((s,x)=>s+x.q*x.c,0);if(page==='Visão geral'||page==='Relatórios'){app.innerHTML=`<div class="grid">${[['Valor em estoque',money(total),'Capital imobilizado'],['Unidades',data.items.reduce((s,x)=>s+x.q,0),'Todos os setores'],['Estoque crítico',low.length,'Itens abaixo do mínimo'],['Validade próxima',exp.length,'Até 30 dias ou vencidos']].map(a=>`<div class="card"><small>${a[0]}</small><strong>${a[1]}</strong><span class="muted">${a[2]}</span></div>`).join('')}</div><div class="split"><section><h2>Distribuição por setor</h2>${[...new Set(data.items.map(x=>x.s))].map(s=>{let v=data.items.filter(x=>x.s===s).reduce((a,x)=>a+x.q*x.c,0);return `<div>${esc(s)} <b style="float:right">${money(v)}</b></div><div class="bar"><i style="width:${total?v/total*100:0}%"></i></div>`}).join('')}</section><section><h2>Prioridades do plantão</h2>${[...new Set([...low,...exp])].map(x=>`<p>◉ ${esc(x.n)} <span class="warn">· revisar</span></p>`).join('')||'Nenhum alerta'}<button onclick="go('Notas fiscais')">Importar nota fiscal →</button></section></div><section><h2>Inventário operacional</h2>${table()}</section>`}else if(page==='Inventário'||page==='Lotes e validades'||page==='Alertas'){app.innerHTML=`<section><div class="row"><input placeholder="Buscar produto ou lote" oninput="document.querySelector('#list').innerHTML=table(data.items.filter(x=>(x.n+x.l).toLowerCase().includes(this.value.toLowerCase())&& (page!=='Alertas'||x.q<x.min||soon(x))))"><button onclick="add()">＋ Produto</button></div><div id="list">${table(page==='Alertas'?data.items.filter(x=>x.q<x.min||soon(x)):data.items)}</div></section>`}else if(page==='Movimentações'){app.innerHTML='<section><h2>Histórico de operações</h2>'+ (data.logs.map(x=>`<p>${esc(x)}</p>`).join('')||'Nenhuma movimentação registrada.')+'</section>'}else if(page==='Contagem'){app.innerHTML='<section><h2>Conferência física</h2>'+data.items.map((x,i)=>`<p>${esc(x.n)} · sistema: ${x.q} <input type="number" min="0" value="${x.q}" id="ct${i}"><button onclick="count(${i})">Conferir</button></p>`).join('')+'</section>'}else if(page==='Fornecedores'){app.innerHTML='<section><h2>Fornecedores registrados por nota</h2>'+([...new Set(data.notes.map(x=>x.vendor))].map(x=>`<p>${esc(x)}</p>`).join('')||'Nenhuma nota confirmada.')+'</section>'}else{app.innerHTML=`<section><span class="tag">DOCUMENTOS · DEMONSTRAÇÃO</span><h2 style="margin-top:16px">Central de notas fiscais</h2><p class="muted">Importe PDF ou fotografia. A leitura automática é simulada; confira e edite todos os campos.</p><div class="split"><div class="upload" ondragover="event.preventDefault()" ondrop="event.preventDefault();load(event.dataTransfer.files[0])"><input type="file" accept="application/pdf,image/*" onchange="load(this.files[0])"><p>Arraste um documento ou selecione do dispositivo.</p><div id="preview"></div></div><div><form id="invoice" onsubmit="confirmNote(event)"><input required placeholder="Número da NF" name="number"><input required placeholder="Fornecedor" name="vendor"><p>Dados de exemplo editáveis</p><select name="item">${data.items.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join('')}</select><input required type="number" min="1" name="qty" value="10"><label>Responsável pela entrada<input required name="operator" placeholder="Nome completo do profissional" autocomplete="name"></label><p><button>Confirmar entrada</button></p></form></div></div></section><section><h2>Notas confirmadas</h2>${data.notes.map(x=>`<p>NF ${esc(x.number)} · ${esc(x.vendor)} · ${esc(x.item)} · ${x.qty} unidades · Responsável: ${esc(x.operator||'Não registrado')} · ${esc(x.date||'Data não registrada')}</p>`).join('')||'Nenhuma nota registrada.'}</section>`}}
function load(f){if(!f)return;if(!f.type.startsWith('image/')&&f.type!=='application/pdf'){alert('Selecione PDF ou imagem');return}let u=URL.createObjectURL(f);document.querySelector('#preview').innerHTML=f.type==='application/pdf'?`<iframe src="${u}"></iframe>`:`<img class="preview" src="${u}">`;document.querySelector('#invoice').number.value='';}function confirmNote(e){e.preventDefault();let f=new FormData(e.target),number=f.get('number').trim(),vendor=f.get('vendor').trim(),operator=f.get('operator').trim();if(!operator)return alert('Informe o nome do responsável');if(data.notes.some(x=>x.number===number&&x.vendor.toLowerCase()===vendor.toLowerCase()))return alert('Nota já registrada');let x=data.items[+f.get('item')],qty=+f.get('qty');x.q+=qty;data.notes.push({number,vendor,item:x.n,qty,operator,date:new Date().toLocaleString('pt-BR')});data.logs.unshift(`Entrada NF ${number}: ${x.n} +${qty} · Responsável: ${operator} · ${new Date().toLocaleString('pt-BR')}`);save()}function count(i){let x=data.items[i],q=+document.querySelector('#ct'+i).value;if(q<0||!Number.isInteger(q))return alert('Quantidade inválida');data.logs.unshift(`Conferência: ${x.n} ${x.q} → ${q}`);x.q=q;save()}function move(){form.innerHTML=`<h2>Nova movimentação</h2><select name="item">${data.items.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join('')}</select><select name="type"><option>Entrada</option><option>Saída</option></select><input name="qty" type="number" min="1" required placeholder="Quantidade"><label>Responsável pela movimentação<input required name="operator" placeholder="Nome completo do profissional" autocomplete="name"></label><button>Confirmar</button> <button type="button" onclick="modal.close()">Cancelar</button>`;form.onsubmit=e=>{e.preventDefault();let f=new FormData(form),x=data.items[+f.get('item')],q=+f.get('qty')*(f.get('type')==='Saída'?-1:1);let operator=f.get('operator').trim();if(!operator)return alert('Informe o nome do responsável');if(x.q+q<0)return alert('Saldo insuficiente');x.q+=q;data.logs.unshift(`${f.get('type')}: ${x.n} ${q>0?'+':''}${q} · Responsável: ${operator} · ${new Date().toLocaleString('pt-BR')}`);modal.close();save()};modal.showModal()}function add(){form.innerHTML='<h2>Novo produto</h2>'+[['n','Nome','text'],['s','Setor','text'],['l','Lote','text'],['v','Validade','date'],['q','Quantidade','number'],['min','Estoque mínimo','number'],['c','Custo unitário','number']].map(([n,p,t])=>`<label>${p}<input required name="${n}" type="${t}" ${t==='number'?'min="0" step="'+(n==='c'?'0.01':'1')+'"':''}></label>`).join('')+'<button>Cadastrar</button> <button type="button" onclick="modal.close()">Cancelar</button>';form.onsubmit=e=>{e.preventDefault();let x=Object.fromEntries(new FormData(form));for(let k of ['q','min','c'])x[k]=+x[k];data.items.push(x);modal.close();save()};modal.showModal()}render();</script></html>
